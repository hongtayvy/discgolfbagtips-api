spring:
  application:
    name: discgolfbagtips-api

  # Supabase Postgres. Use the session/pooler connection string in SUPABASE_DB_URL, e.g.
  # jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/dgbt}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 10000
      pool-name: bagtips-pool
      # Supabase installs pgvector into an `extensions` schema rather than `public`, so a connection
      # with the default search_path cannot resolve the `vector` type and every migration touching it
      # fails with "type vector does not exist". Setting this per connection fixes Flyway and runtime
      # queries alike, and is harmless elsewhere: Postgres silently ignores schemas in search_path
      # that do not exist, which is the case locally where the extension lives in `public`.
      connection-init-sql: SET search_path TO public, extensions

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  session:
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
    timeout: 7d

  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        name: BAGTIPS_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
  shutdown: graceful

bagtips:
  admin-token: ${ADMIN_TOKEN:}
  # Deployed base URL, so Swagger's "Try it out" targets the right host. Unset locally.
  public-base-url: ${PUBLIC_BASE_URL:}

  discit:
    base-url: https://discit-api.fly.dev
    sync-enabled: true
    sync-cron: "0 15 3 * * *"

  # Model chosen by measurement, not by leaderboard: `mvn test -Peval` scores it at 0.800
  # precision@5 against this catalog, versus 0.150 for all-MiniLM-L6-v2. MiniLM's 256-token limit
  # truncated ~37% of the query passage; arctic's 512 fits it whole.
  embedding:
    base-url: https://router.huggingface.co/hf-inference/models
    model: Snowflake/snowflake-arctic-embed-s
    dimensions: 384
    api-token: ${HUGGINGFACE_API_TOKEN:}
    batch-size: 32
    backfill-enabled: true
    backfill-cron: "0 45 3 * * *"
    max-per-run: 500
    backfill-throttle: 250ms
    # auto | huggingface | ollama | local
    provider: ${EMBEDDING_PROVIDER:auto}
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      model-tag: ${OLLAMA_EMBEDDING_MODEL:snowflake-arctic-embed:33m}
    # arctic-embed is asymmetric: queries carry an instruction, documents do not. Dropping this
    # silently costs most of the quality that motivated the switch.
    query-prefix: "Represent this sentence for searching relevant passages: "
    document-prefix: ""

  retrieval:
    candidate-limit: 8
    over-fetch: 40
    minimum-similarity: 0.15
    alternative-count: 3

  # Groq by default; point base-url at https://openrouter.ai/api/v1 and set the model to switch.
  generation:
    provider: ${GENERATION_PROVIDER:groq}
    base-url: ${GENERATION_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GENERATION_MODEL:llama-3.3-70b-versatile}
    api-key: ${GENERATION_API_KEY:}
    temperature: 0.3
    max-tokens: 900

  rate-limit:
    enabled: true
    capacity: 60
    refill-tokens: 60
    refill-period: 1m
    # The expensive endpoint: every call spends embedding and reasoning-model quota.
    recommendation-capacity: 10
    recommendation-refill-tokens: 10
    recommendation-refill-period: 1m

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Circuit breakers wrap each upstream separately: a Hugging Face outage must not open the breaker
# that protects the reasoning model, and neither should affect catalog search.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
    instances:
      discit:
        base-config: default
        wait-duration-in-open-state: 5m
      embedding:
        base-config: default
        wait-duration-in-open-state: 60s
      generation:
        base-config: default
        wait-duration-in-open-state: 45s
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
    instances:
      discit:
        base-config: default
        max-attempts: 2
      embedding:
        base-config: default
      generation:
        base-config: default
        max-attempts: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

springdoc:
  swagger-ui:
    path: /docs
    # Grouped by tag and collapsed, because 23 operations expanded is a wall.
    tags-sorter: alpha
    operations-sorter: method
    doc-expansion: none
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.discgolfbagtips.api: INFO
