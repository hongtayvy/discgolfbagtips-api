# Render blueprint.
#
# The database lives in Supabase rather than Render: its free tier ships pgvector and does not sleep
# the way a free Render Postgres does. See docs/SUPABASE.md.
#
# Embedding must use the hosted provider here — Ollama runs on a developer machine and is not
# reachable from Render, so EMBEDDING_PROVIDER is pinned rather than left on `auto`.
services:
  - type: web
    name: discgolfbagtips-api
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /actuator/health/readiness
    envVars:
      # --- database (Supabase session pooler, port 5432) ---
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER          # note the form: postgres.<project-ref>
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      # Free tier is memory-constrained and Supabase's pooler has its own limits; a small pool is
      # plenty for this traffic and leaves headroom for the JVM.
      - key: DB_POOL_SIZE
        value: "3"

      # --- embedding: hosted, since Ollama is local-only ---
      - key: EMBEDDING_PROVIDER
        value: huggingface
      - key: HUGGINGFACE_API_TOKEN
        sync: false

      # --- generation ---
      - key: GENERATION_PROVIDER
        value: groq
      - key: GENERATION_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GENERATION_MODEL
        value: llama-3.3-70b-versatile
      - key: GENERATION_API_KEY
        sync: false

      # --- ops ---
      - key: ADMIN_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://discgolfbagtips.pages.dev,http://localhost:5173
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # Makes Swagger's "Try it out" hit the deployed host rather than localhost.
      - key: PUBLIC_BASE_URL
        value: https://discgolfbagtips-api.onrender.com
      # Render injects PORT; server.port already reads it, listed here only so the contract is visible.
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC
